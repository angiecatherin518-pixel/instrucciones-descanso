
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080d1b">

    <title>Instrucciones para descansar</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main id="app">

        <!-- PRIMERA ESCENA -->
        <section id="inicio" class="pantalla activa">

            <div class="reloj">
                <div class="manecilla"></div>
                <div class="centro-reloj"></div>
            </div>

            <p class="hora">02:47 AM</p>

            <div class="texto-guia">
                <p id="mensaje">
                    Mañana tienes una entrevista importante.
                </p>
            </div>

            <button id="continuar" class="boton-continuar">
                Toca para continuar
            </button>

        </section>

        <!-- SEGUNDA ESCENA -->
       
<section id="habitacion" class="pantalla">
    <div class="encabezado-habitacion">
        <p class="hora">02:47 AM</p>
        <h1>Elige dónde descansar</h1>
        <p>Desliza la cobija hacia abajo para comenzar.</p>
    </div>

    <div class="habitacion">
        <div class="ventana">
            <span>☾</span>
            <span>✦　　·　　✧</span>
        </div>

        <div class="camas">
            <button class="cama" data-ritual="ovejas">
                <span class="nombre-cama">Contar ovejas</span>
                <span class="ilustracion-cama">🐑</span>
                <span class="cobija">Desliza ↓</span>
            </button>

            <button class="cama" data-ritual="respiracion">
                <span class="nombre-cama">Respirar</span>
                <span class="ilustracion-cama">☁️</span>
                <span class="cobija">Desliza ↓</span>
            </button>

            <button class="cama" data-ritual="colores">
                <span class="nombre-cama">Repetir colores</span>
                <span class="ilustracion-cama">🎨</span>
                <span class="cobija">Desliza ↓</span>
            </button>

            <button class="cama" data-ritual="ruido">
                <span class="nombre-cama">Ruido blanco</span>
                <span class="ilustracion-cama">📻</span>
                <span class="cobija">Desliza ↓</span>
            </button>
        </div>

        <div class="decoracion">
            <span>✧</span>
            <span>☾</span>
            <span>✦</span>
            <span>·</span>
        </div>
    </div>

    <p id="mensaje-ritual" class="mensaje-ritual">
        Puedes elegir cualquiera de las cuatro camas.
    </p>
</section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
